name: Deploy to EC2

on:
  push:
    branches: ["develop"]

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com

jobs:
  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        run: |
          docker build \
            -t $ECR_REGISTRY/${{ secrets.ECR_API_REPO }}:latest \
            -t $ECR_REGISTRY/${{ secrets.ECR_API_REPO }}:${{ github.sha }} \
            ./t0016Go
          docker push $ECR_REGISTRY/${{ secrets.ECR_API_REPO }}:latest
          docker push $ECR_REGISTRY/${{ secrets.ECR_API_REPO }}:${{ github.sha }}

      - name: Build and push App image
        run: |
          docker build \
            -t $ECR_REGISTRY/${{ secrets.ECR_APP_REPO }}:latest \
            -t $ECR_REGISTRY/${{ secrets.ECR_APP_REPO }}:${{ github.sha }} \
            ./t0016Next
          docker push $ECR_REGISTRY/${{ secrets.ECR_APP_REPO }}:latest
          docker push $ECR_REGISTRY/${{ secrets.ECR_APP_REPO }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: ec2-docker-compose.yml
          target: /home/ec2-user/

      - name: Pull and restart containers on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            aws ecr get-login-password --region ap-northeast-1 \
              | docker login --username AWS \
                --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com
            cd /home/ec2-user
            ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com \
            ECR_API_REPO=${{ secrets.ECR_API_REPO }} \
            ECR_APP_REPO=${{ secrets.ECR_APP_REPO }} \
            docker compose -f ec2-docker-compose.yml pull
            ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-1.amazonaws.com \
            ECR_API_REPO=${{ secrets.ECR_API_REPO }} \
            ECR_APP_REPO=${{ secrets.ECR_APP_REPO }} \
            docker compose -f ec2-docker-compose.yml up -d

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            sleep 10
            curl -f http://localhost:8080/health || exit 1
            curl -f http://localhost/user/signin || exit 1
