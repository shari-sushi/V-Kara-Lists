name: App (Next.js)

on:
  push:
    branches: ["*"]
    paths:
      - 't0016Next/**'
      - 'docker-compose*.yml'
      - 'ec2-docker-compose.yml'
      - '.github/workflows/**'
  pull_request:
    branches: [develop]
    paths:
      - 't0016Next/**'
      - 'docker-compose*.yml'
      - 'ec2-docker-compose.yml'
      - '.github/workflows/**'

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: t0016Next/myapp/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: t0016Next/myapp

    - name: Build
      run: npm run build
      working-directory: t0016Next/myapp

    - name: Lint
      run: npm run lint
      working-directory: t0016Next/myapp
